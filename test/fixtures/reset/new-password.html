<!doctype html><html><head><style>
  .wrap { width: 360px; margin: 40px auto; font-family: sans-serif; }
  .field { position: relative; }
  .field input { width: 100%; height: 46px; box-sizing: border-box; padding: 0 40px 0 16px; }
  .toggle { position: absolute; inset-block: 0; right: 0; padding: 0 16px; }
</style></head><body>
<div class="wrap"><form>
  <h1>Please enter your new password</h1>
  <label>Your new password</label>
  <div class="field">
    <input type="password" value="">
    <button type="button" data-agent-id="password-visibility-toggle" class="toggle">o</button>
  </div>
  <label>Repeat new password</label>
  <div class="field">
    <input type="password" value="">
    <button type="button" data-agent-id="password-visibility-toggle" class="toggle">o</button>
  </div>
  <div>
    <p class="text-xs">Minimum 8 letters</p>
    <p class="text-xs">At least one number</p>
    <p class="text-xs">At least one special character</p>
  </div>
  <button disabled type="submit">Change Password</button>
</form></div>
<script>
const [a, b] = document.querySelectorAll('input[type=password]');
const submit = document.querySelector('button[type=submit]');
// Enforce the three rules the form displays, plus the repeat having to match.
const ok = (v) => v.length >= 8 && /[0-9]/.test(v) && /[^A-Za-z0-9]/.test(v);
const sync = () => { submit.disabled = !(ok(a.value) && a.value === b.value); };
a.addEventListener('input', sync);
b.addEventListener('input', sync);
document.querySelectorAll('.toggle').forEach((t) => t.addEventListener('click', () => {
  window.__toggleClicked = (window.__toggleClicked || 0) + 1;
}));
submit.addEventListener('click', (e) => {
  e.preventDefault();
  // Success leaves /app/action, as the real flow does.
  setTimeout(() => { location.href = 'done.html'; }, 200);
});
</script>
</body></html>
