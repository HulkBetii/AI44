<!doctype html><html><body>
<div id="app">
<h1>Reset your password</h1>
<form>
  <label for="email">Email</label>
  <input data-testid="forgot-password-email-input" autocomplete="email" required type="email" name="email">
  <input class="hidden" style="display:none" autocomplete="current-password" type="password" name="password">
  <button data-loading="false" disabled>Continue</button>
</form>
</div>
<script>
const email = document.querySelector('[data-testid="forgot-password-email-input"]');
const btn = document.querySelector('button');
// Mirror the real form: Continue stays disabled until the address validates.
email.addEventListener('input', () => { btn.disabled = !email.checkValidity() || !email.value; });
btn.addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('app').innerHTML =
    '<h1>Check your Inbox</h1><p>Thanks! If ' + email.value +
    " matches an email address we have on file, then we've sent you an email.</p>" +
    '<button disabled>Resend (34s)</button>';
});
</script>
</body></html>
